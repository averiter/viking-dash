# Compile la version web (WebAssembly) et la publie sur GitHub Pages.
# Déclenché à chaque push sur la branche principale, ou à la main depuis l'onglet Actions.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push annule celui en attente.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: "0.2.129" # doit correspondre à la version de la crate wasm-bindgen dans Cargo.lock
  BINARYEN_VERSION: "version_133"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable + cible wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: web
          workspaces: ". -> target-wasm"
          cache-on-failure: true

      - name: Installer wasm-bindgen et wasm-opt
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz --strip-components=2 -C "$HOME/.local/bin" "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-bindgen" --version
          "$HOME/.local/bin/wasm-opt" --version

      - name: Compiler la version web
        run: ./build-web.sh

      - name: Taille du build
        run: du -sh web/pkg/* web/assets

      - uses: actions/configure-pages@v5

      - name: Publier le dossier web/ comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
