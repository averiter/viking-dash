[package]
name = "viking-dash"
version = "0.3.0"
edition = "2021"

[dependencies]
# Fonctionnalités Bevy minimales (2D, interface, texte, audio) : pas de 3D, de glTF,
# d'animation, de scènes ni de picking. Divise par deux le poids de la version web.
bevy = { version = "0.19", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_log", "bevy_state",
    "bevy_winit", "bevy_window", "default_font",
    "bevy_color", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_shader",
    "bevy_render", "bevy_core_pipeline",
    "bevy_sprite", "bevy_sprite_render", "bevy_text",
    "bevy_ui", "bevy_ui_render", "bevy_input_focus",
    "bevy_audio", "wav",
    "bevy_gilrs",
] }
rand = "0.9"

# Sur ordinateur : polices système (Luminari sur macOS), captures PNG du mode test, Linux.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["system_font_discovery", "png", "x11", "wayland"] }

# Sur le web : WebGL2, aléatoire via JavaScript, record dans localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgl2", "web"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Build web : binaire compact.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
debug = false
panic = "abort"
