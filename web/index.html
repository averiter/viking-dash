<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080f24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Viking Dash — La Route de Valhalla</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b32d22' stroke='%236c6f78' stroke-width='6'/%3E%3Crect x='29' y='6' width='6' height='52' fill='%23231a10'/%3E%3Crect x='6' y='29' width='52' height='6' fill='%23231a10'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%236c6f78'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080f24; }
    body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
    #viking { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffd95a; font-family: Luminari, Georgia, serif; text-align: center; gap: 12px; pointer-events: none;
    }
    #loading h1 { margin: 0; font-size: clamp(32px, 9vmin, 80px); letter-spacing: 2px; text-shadow: 3px 3px 0 #000; }
    #loading p { margin: 0; color: #d7dcff; font-size: clamp(14px, 3vmin, 22px); }
    #bar { width: min(60vw, 320px); height: 8px; border: 2px solid #ffd95a; border-radius: 6px; overflow: hidden; }
    #bar div { height: 100%; width: 0; background: #ffd95a; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="viking"></canvas>
  <div id="loading">
    <h1>VIKING DASH</h1>
    <p>Le drakkar approche…</p>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <script type="module">
    import init from './pkg/viking_dash.js';
    const fill = document.getElementById('fill');
    const loading = document.getElementById('loading');
    // Téléchargement avec barre de progression, puis démarrage du jeu.
    async function fetchWithProgress(url) {
      const res = await fetch(url);
      const total = +res.headers.get('Content-Length') || 0;
      if (!res.body || !total) return res;
      const reader = res.body.getReader();
      let received = 0;
      const chunks = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        fill.style.width = Math.round(100 * received / total) + '%';
      }
      return new Response(new Blob(chunks), { headers: { 'Content-Type': 'application/wasm' } });
    }
    try {
      await init({ module_or_path: fetchWithProgress('./pkg/viking_dash_bg.wasm') });
    } catch (e) {
      // Bevy sort de `main` via une exception de contrôle sur le web ; les vraies erreurs sont affichées.
      if (!String(e).includes('Using exceptions for control flow')) {
        loading.querySelector('p').textContent = 'Erreur : ' + e;
        throw e;
      }
    }
    loading.remove();
  </script>
</body>
</html>
